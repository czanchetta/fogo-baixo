<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fogo Baixo — um caderno pessoal de cozinha</title>
<meta name="description" content="Fogo Baixo: caderno pessoal de técnicas e receitas de Celso Zanchetta, em português, español e English. Cada receita em quatro formatos.">
<meta name="author" content="Celso Zanchetta">
<meta name="theme-color" content="#eaefe4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12140d" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="Fogo Baixo — um caderno pessoal de cozinha">
<meta property="og:description" content="Técnicas e receitas testadas em casa, cada uma em quatro formatos de leitura.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2315180f'/%3E%3Ctext x='16' y='23' font-size='19' font-family='Helvetica,Arial' font-weight='bold' fill='%23c07d1c' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">
<style>
:root{
  --paper:#eaefe4; --card:#fbfbf8; --cell:#dde6d4;
  --ink:#15180f; --ink-2:#5c614f; --hair:#c3cbb8;
  --accent:#c07d1c;
  --rule:#15180f;
  --band-bg:#15180f; --band-fg:#eef1e6;
  --sel-bg:#15180f;  --sel-fg:#f4f6ef;
  --hero-bg:#15180f; --hero-fg:#eef1e6; --hero-dim:#c3ccb5; --hero-line:#4a5140; --hero-quiet:#8e9a7c;
  --hover:#dfe6d7;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
}
html[data-tema="escuro"]{
  --paper:#12140d; --card:#1b1e15; --cell:#2b3120;
  --ink:#e9ede0; --ink-2:#9aa48a; --hair:#333a2b;
  --accent:#d99a33;
  --rule:#4d5642;
  --band-bg:#2b3120; --band-fg:#e9ede0;
  --sel-bg:#d99a33;  --sel-fg:#14160e;
  --hero-bg:#080a05; --hero-fg:#e9ede0; --hero-dim:#9aa48a; --hero-line:#3f4636; --hero-quiet:#79856a;
  --hover:#242819;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  transition:background-color .18s ease, color .18s ease}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- layout ---------- */
.wrap{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:100vh}
@media (max-width:900px){ .wrap{grid-template-columns:1fr} }

/* ---------- sidebar ---------- */
.side{border-right:1px solid var(--hair);padding:28px 22px 60px;
  position:sticky;top:0;height:100vh;overflow:auto}
.side-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.brand{font-weight:800;letter-spacing:-.03em;font-size:26px;line-height:1;margin:0 0 4px;
  background:none;border:0;padding:0;text-align:left;display:block;font-family:var(--sans)}
.brand:hover small{color:var(--accent)}
.brand small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;font-weight:500;color:var(--ink-2);margin-top:9px}
.nav-toggle{display:none;border:1px solid var(--rule);background:none;border-radius:3px;
  padding:9px 14px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  font-weight:700;white-space:nowrap;flex:none}
.nav-toggle[aria-expanded="true"]{background:var(--sel-bg);color:var(--sel-fg)}

.prefs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 4px;align-items:center}
.seg-mini{display:flex;border:1px solid var(--hair);border-radius:3px;overflow:hidden}
.seg-mini button{background:none;border:0;padding:6px 10px;font-family:var(--mono);
  font-size:10.5px;font-weight:700;letter-spacing:.08em;line-height:1;color:var(--ink-2)}
.seg-mini button[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-fg)}
.seg-mini button:hover{color:var(--ink)}
.tema-btn{border:1px solid var(--hair);background:none;border-radius:3px;padding:6px 11px;
  font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.08em;line-height:1;
  display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.tema-btn:hover{color:var(--ink);border-color:var(--ink-2)}
.tema-btn svg{width:13px;height:13px;flex:none}

.side h4{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-2);font-weight:600;margin:30px 0 10px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{text-align:left;background:none;border:0;padding:8px 10px;border-radius:5px;
  font-size:14.5px;line-height:1.3;color:var(--ink)}
.nav button:hover{background:var(--hover)}
.nav button[aria-current="true"]{background:var(--sel-bg);color:var(--sel-fg);font-weight:600}
.nav .num{font-family:var(--mono);font-size:11px;opacity:.5;margin-right:8px}
.cap{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-2);font-weight:600;margin:16px 0 5px;padding-left:10px;opacity:.8}
.side-foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--hair);
  font-size:12.5px;line-height:1.45;color:var(--ink-2)}
.side-foot a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--hair)}
.side-foot a:hover{border-bottom-color:var(--accent)}
.side-foot p{margin:0 0 8px}
@media (max-width:900px){
  .side{position:sticky;top:0;z-index:30;height:auto;max-height:100vh;overflow:auto;
    border-right:0;border-bottom:1px solid var(--hair);padding:16px 20px;background:var(--paper)}
  .nav-toggle{display:block}
  .side-nav{display:none;padding-bottom:12px}
  .side.aberta .side-nav{display:block}
  .brand{font-size:22px}
  .brand small{margin-top:6px}
  .side h4{margin-top:22px}
}

/* ---------- main ---------- */
.main{padding:44px 48px 120px;max-width:1280px}
@media (max-width:900px){ .main{padding:28px 20px 90px} }
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--accent);font-weight:600;margin:0 0 14px}
h1.title{font-size:clamp(38px,6vw,68px);line-height:.94;letter-spacing:-.035em;font-weight:800;margin:0}
.lede{font-size:clamp(17px,2vw,21px);line-height:1.4;max-width:34ch;margin:18px 0 0}
.rule{height:1px;background:var(--rule);opacity:.55;margin:26px 0 0}
.meta{display:flex;flex-wrap:wrap;gap:26px;padding:14px 0 0;font-family:var(--mono);font-size:12.5px}
.meta span{color:var(--ink-2);letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.meta b{font-weight:600;margin-left:8px;letter-spacing:0;text-transform:none;font-size:12.5px;color:var(--ink)}

/* ---------- controles ---------- */
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;margin:24px 0 22px}
.ctl{display:flex;align-items:center;gap:9px}
.ctl > span{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2)}
.seg{display:flex;gap:6px}
.seg button{border:1px solid var(--rule);background:transparent;padding:7px 15px;border-radius:3px;
  font-family:var(--mono);font-size:13px;font-weight:600;line-height:1}
.seg button[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-fg);border-color:var(--sel-bg)}
.cook-btn{margin-left:auto;background:var(--accent);color:#fff;border:0;padding:12px 24px;border-radius:3px;
  font-family:var(--mono);font-size:13.5px;font-weight:700;letter-spacing:.06em}
.cook-btn:hover{filter:brightness(1.07)}
@media (max-width:700px){ .cook-btn{margin-left:0;width:100%;text-align:center} }

/* ---------- abas ---------- */
.tabs{display:flex;border-bottom:1px solid var(--hair);margin:0 0 26px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:11px 18px 10px;
  font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-2);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}

/* ---------- capa ---------- */
.capa{margin:-44px -48px 0}
@media (max-width:900px){ .capa{margin:-28px -20px 0} }
.hero{background:var(--hero-bg);color:var(--hero-fg);padding:76px 48px 62px;overflow:hidden}
@media (max-width:900px){ .hero{padding:52px 22px 44px} }
.hero .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--accent);font-weight:600}
.hero h1{font-size:clamp(58px,11vw,132px);line-height:.86;letter-spacing:-.05em;font-weight:800;margin:26px 0 0}
.hero p.sub{font-size:clamp(17px,2.1vw,23px);line-height:1.36;max-width:28ch;margin:26px 0 0;color:var(--hero-dim)}
.hero .assina{margin-top:44px;font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--hero-fg);line-height:2}
.hero .assina i{display:block;font-style:normal;color:var(--hero-quiet);font-size:10px}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.hero .cta button, .hero .cta a{border:1px solid var(--hero-line);background:none;color:var(--hero-fg);
  border-radius:3px;padding:13px 22px;font-family:var(--mono);font-size:12.5px;font-weight:700;
  letter-spacing:.08em;text-decoration:none;display:inline-block;line-height:1}
.hero .cta .primary{background:var(--accent);border-color:var(--accent);color:#14160e}
.hero .cta button:hover, .hero .cta a:hover{border-color:var(--hero-quiet)}
.capa-corpo{padding:52px 48px 0}
@media (max-width:900px){ .capa-corpo{padding:36px 20px 0} }
.formatos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  border-top:1px solid var(--hair);border-left:1px solid var(--hair);margin-top:18px}
.formatos div{padding:18px 20px;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.formatos h5{margin:0 0 6px;font-size:15px;letter-spacing:-.01em}
.formatos p{margin:0;font-size:13.5px;line-height:1.45;color:var(--ink-2)}
.secao-t{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-2);font-weight:700;margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
.bloco{margin-top:46px}
.intro{font-size:14.5px;color:var(--ink-2);line-height:1.5;margin:0 0 4px}
.lista-cap{margin-top:26px}
.lista-cap h6{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent);font-weight:700;margin:0 0 8px}
.itens{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));
  border-top:1px solid var(--hair);border-left:1px solid var(--hair)}
.itens button{background:var(--card);border:0;border-right:1px solid var(--hair);
  border-bottom:1px solid var(--hair);text-align:left;padding:15px 17px;display:block;width:100%}
.itens button:hover{background:var(--cell)}
.itens .n{font-family:var(--mono);font-size:10.5px;color:var(--accent);font-weight:700}
.itens .t{display:block;font-size:15.5px;font-weight:650;letter-spacing:-.012em;margin:5px 0 4px;line-height:1.2}
.itens .k{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-2);line-height:1.4}

/* ---------- sobre ---------- */
.sobre{max-width:62ch}
.sobre p{font-size:16.5px;line-height:1.62}
.sobre .idbox{margin-top:34px;padding:22px 24px;border:1px solid var(--rule);background:var(--card)}
.sobre .idbox h4{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-2);margin:0 0 10px;font-weight:700}
.sobre .idbox a{color:var(--ink);font-weight:600}

/* ---------- colofão ---------- */
.colofao{margin-top:72px;padding-top:22px;border-top:1px solid var(--rule);
  display:flex;flex-wrap:wrap;gap:12px 34px;align-items:baseline}
.colofao p{margin:0;font-size:13.5px;color:var(--ink-2);max-width:46ch;line-height:1.5}
.colofao .links{display:flex;gap:18px;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em}
.colofao a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--hair);padding-bottom:1px}
.colofao a:hover{border-bottom-color:var(--accent)}

/* ---------- tradicional ---------- */
.trad{display:grid;grid-template-columns:minmax(240px,320px) minmax(0,1fr);gap:52px}
@media (max-width:820px){ .trad{grid-template-columns:1fr;gap:32px} }
.trad h3{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-2);margin:0 0 14px;padding-bottom:9px;border-bottom:1px solid var(--rule)}
.ing-list{list-style:none;margin:0;padding:0}
.ing-list li{padding:9px 0;border-bottom:1px solid var(--hair);font-size:15px;line-height:1.35}
.ing-list .q{font-family:var(--mono);font-weight:700;margin-right:7px}
.ing-list .obs{display:block;color:var(--ink-2);font-size:13px;margin-top:2px}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px;
  padding:0 0 22px;font-size:16.5px;line-height:1.52}
.steps li::before{content:counter(s);font-family:var(--mono);font-size:13px;font-weight:700;
  color:var(--accent);border:1px solid var(--accent);border-radius:50%;width:28px;height:28px;
  display:grid;place-items:center;margin-top:2px}
.notas{margin-top:36px;border-top:1px solid var(--rule);padding-top:16px}
.notas h3{margin-bottom:12px}
.notas ul{margin:0;padding-left:18px}
.notas li{font-size:14.5px;line-height:1.5;color:var(--ink-2);margin-bottom:9px}

/* ---------- tabela de cozimento ---------- */
.grid-scroll{overflow-x:auto;border:1px solid var(--rule);background:var(--card);position:relative}
.grid-band{background:var(--band-bg);color:var(--band-fg);text-align:center;padding:13px 16px;
  font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.grid{display:grid}
.g-ing{border-right:1px solid var(--rule);border-bottom:1px solid var(--hair);
  padding:12px 15px;font-size:14.5px;line-height:1.35;background:var(--card);display:flex;align-items:center}
.g-ing .q{font-family:var(--mono);font-weight:700;margin-right:7px;white-space:nowrap}
.g-ing .obs{color:var(--ink-2)}
.g-step{background:var(--cell);border-right:1px solid var(--card);border-bottom:1px solid var(--card);
  padding:16px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:6px}
.g-step .t{font-weight:650;font-size:15px;line-height:1.22;letter-spacing:-.01em}
.g-step .d{font-family:var(--mono);font-size:11.5px;line-height:1.35;color:var(--ink-2)}
.g-empty{background:var(--card);border-bottom:1px solid var(--card)}
.hint{font-family:var(--mono);font-size:11px;color:var(--ink-2);margin-top:10px;letter-spacing:.06em}

/* ---------- técnica ---------- */
.tech{max-width:66ch}
.tech section{margin:34px 0}
.tech h2{font-size:24px;letter-spacing:-.02em;margin:0 0 10px;line-height:1.15}
.tech p{font-size:17px;line-height:1.62;margin:0}

/* ---------- modo cozinha (sempre escuro) ---------- */
.kitchen{position:fixed;inset:0;background:#12140d;color:#f2f4ea;z-index:60;display:none;
  flex-direction:column;padding:26px 30px 30px}
.kitchen.on{display:flex}
.k-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.k-top .k-name{font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#9fae8c}
.k-x{margin-left:auto;background:none;border:1px solid #4a5140;color:#f2f4ea;border-radius:3px;
  padding:9px 16px;font-family:var(--mono);font-size:12px;letter-spacing:.1em}
.k-body{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:44px;align-items:start;
  padding-top:26px;overflow:auto}
@media (max-width:860px){ .k-body{grid-template-columns:1fr;gap:22px} }
.k-count{font-family:var(--mono);font-size:13px;letter-spacing:.2em;color:#9fae8c;margin-bottom:20px}
.k-text{font-size:clamp(24px,3.9vw,44px);line-height:1.26;letter-spacing:-.02em;font-weight:600;margin:0}
.k-ings{border-left:1px solid #333a2b;padding-left:22px}
.k-ings h4{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:#9fae8c;margin:0 0 12px;font-weight:600}
.k-ings ul{margin:0;padding:0}
.k-ings li{list-style:none;font-size:16px;padding:7px 0;border-bottom:1px solid #262c1e;line-height:1.3}
.k-ings .q{font-family:var(--mono);font-weight:700;margin-right:6px}
.k-timer{margin-top:34px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.k-clock{font-family:var(--mono);font-size:clamp(40px,7vw,74px);font-weight:700;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:1}
.k-clock.ring{color:#ffcf6a;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.k-tbtn{background:var(--accent);border:0;color:#14160e;border-radius:3px;padding:14px 26px;
  font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.06em}
.k-tbtn.ghost{background:none;border:1px solid #4a5140;color:#f2f4ea}
.k-nav{display:flex;gap:12px;padding-top:22px;border-top:1px solid #262c1e;margin-top:22px}
.k-nav button{flex:1;background:none;border:1px solid #4a5140;color:#f2f4ea;border-radius:3px;
  padding:20px;font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.08em}
.k-nav button.primary{background:#e9eee0;color:#12140d;border-color:#e9eee0}
.k-nav button:disabled{opacity:.3}
.k-prog{display:flex;gap:4px;margin-top:16px}
.k-prog i{flex:1;height:3px;background:#333a2b;border-radius:2px}
.k-prog i.done{background:var(--accent)}

/* ---------- impressão: sempre claro ---------- */
@media print{
  html[data-tema]{--paper:#fff;--card:#fff;--cell:#dde6d4;--ink:#15180f;--ink-2:#5c614f;
    --hair:#c3cbb8;--rule:#15180f;--band-bg:#15180f;--band-fg:#eef1e6}
  .side,.tabs,.controls,.cook-btn,.hint,.colofao .links{display:none!important}
  body{background:#fff}
  .wrap{display:block}
  .main{padding:0;max-width:none}
  .grid-scroll{overflow:visible;break-inside:avoid}
  .grid{min-width:0!important}
}
</style>
</head>
<body>
<div class="wrap">
  <aside class="side" id="side">
    <div class="side-top">
      <button class="brand" id="ir-capa">Fogo&nbsp;Baixo<small id="brand-sub"></small></button>
      <button class="nav-toggle" id="toggle-nav" aria-expanded="false"></button>
    </div>
    <div class="side-nav" id="side-nav">
      <div class="prefs">
        <div class="seg-mini" id="seg-idioma"></div>
        <button class="tema-btn" id="btn-tema"></button>
      </div>
      <h4 id="h-tecnicas"></h4>
      <nav class="nav" id="nav-tec"></nav>
      <h4 id="h-receitas"></h4>
      <nav class="nav" id="nav-rec"></nav>
      <div class="side-foot">
        <p id="foot-assina"></p>
        <p><a href="#sobre" id="link-sobre"></a></p>
      </div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<div class="kitchen" id="kitchen" aria-hidden="true"></div>

<script>
/* ============================================================
   FOGO BAIXO — conteúdo trilíngue
   ------------------------------------------------------------
   T("português", "español", "english") define uma string nos
   três idiomas. Estrutura, quantidades, grades e timers são
   definidos UMA vez só — só o texto é traduzido.

   Para acrescentar uma receita: copie um bloco e preencha.
   Se você só sabe o texto em português, repita o português nos
   três campos — o site não quebra, só fica sem tradução.
   ============================================================ */

const T = (pt, es, en) => ({ pt, es, en });

const IDIOMAS = [
  { cod: "pt", nome: "Português", curto: "PT", htmlLang: "pt-BR" },

/* =========================================================
   utilidades
   ========================================================= */
const $ = (s, r) => (r || document).querySelector(s);
const el = (tag, c, h) => { const n = document.createElement(tag); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* estado global de preferências */
const prefs = { lang: "pt", tema: "claro", sistema: "caseiro" };

/* t() resolve uma string trilíngue no idioma atual */
function t(v){
  if (v == null) return "";
  if (typeof v === "string") return v;
  return v[prefs.lang] != null ? v[prefs.lang] : (v.pt != null ? v.pt : "");
}
function unidade(cod, plural){
  const u = UNI[cod];
  if (!u) return cod || "";
  const par = u[prefs.lang] || u.pt;
  return plural ? par[1] : par[0];
}

const FRACOES = [[1/8,"⅛"],[1/6,"⅙"],[1/4,"¼"],[1/3,"⅓"],[1/2,"½"],[2/3,"⅔"],[3/4,"¾"]];
function fracao(n){
  if (!isFinite(n)) return "";
  const inteiro = Math.floor(n + 1e-6);
  const resto = n - inteiro;
  if (resto < 0.04) return String(inteiro);
  if (resto > 0.96) return String(inteiro + 1);
  let melhor = null, erro = 1;
  for (const [v, s] of FRACOES){ const e = Math.abs(resto - v); if (e < erro){ erro = e; melhor = s; } }
  if (erro > 0.06) return decimal(Math.round(n * 100) / 100);
  return (inteiro ? inteiro + " " : "") + melhor;
}
/* vírgula decimal em pt/es, ponto em en */
function decimal(n){
  const s = String(n);
  return prefs.lang === "en" ? s : s.replace(".", ",");
}
const UNI_PESO = new Set(["g","ml","kg","l"]);
function arredondaPeso(n){
  if (n >= 200) return Math.round(n / 10) * 10;
  if (n >= 50)  return Math.round(n / 5) * 5;
  if (n >= 10)  return Math.round(n);
  return Math.round(n * 10) / 10;
}
function formataQtd(q, cod){
  if (q == null) return "";
  if (UNI_PESO.has(cod)) return decimal(arredondaPeso(q));
  return fracao(q);
}
function resolve(ing, fator){
  const base = (prefs.sistema === "peso" && ing.alt) ? ing.alt : ing;
  if (base.q == null) return { q: null, u: base.u || "" };
  const escala = ing.escala === false ? 1 : fator;
  return { q: base.q * escala, u: base.u };
}
function textoIng(ing, fator){
  const r = resolve(ing, fator);
  if (r.q == null) return { q: "", nome: t(ing.nome), obs: ing.obs ? t(ing.obs) : "" };
  const q = formataQtd(r.q, r.u);
  const u = r.u ? unidade(r.u, r.q > 1.0001) : "";
  return { q: (q + (u ? " " + u : "")).trim(), nome: t(ing.nome), obs: ing.obs ? t(ing.obs) : "" };
}
function mmss(s){
  const m = Math.floor(s / 60), r = s % 60;
  return String(m).padStart(2, "0") + ":" + String(r).padStart(2, "0");
}
const guarda = (k, v) => { try{ localStorage.setItem("fogobaixo:" + k, v); }catch(e){} };
const lembra  = k => { try{ return localStorage.getItem("fogobaixo:" + k); }catch(e){ return null; } };

/* =========================================================
   idioma e tema
   ========================================================= */
function detectaIdioma(){
  const salvo = lembra("lang");
  if (salvo && IDIOMAS.some(i => i.cod === salvo)) return salvo;
  const nav = (navigator.languages || [navigator.language || "pt"]).map(x => String(x).toLowerCase());
  for (const l of nav){
    if (l.startsWith("es")) return "es";
    if (l.startsWith("en")) return "en";
    if (l.startsWith("pt")) return "pt";
  }
  return "pt";
}
function detectaTema(){
  const salvo = lembra("tema");
  if (salvo === "claro" || salvo === "escuro") return salvo;
  return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "escuro" : "claro";
}
function aplicaTema(tema, salvar){
  prefs.tema = tema;
  document.documentElement.setAttribute("data-tema", tema);
  if (salvar) guarda("tema", tema);
  pintaBotaoTema();
}
const SOL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>';
const LUA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>';
function pintaBotaoTema(){
  const b = $("#btn-tema"); if (!b) return;
  const escuro = prefs.tema === "escuro";
  b.innerHTML = (escuro ? SOL : LUA) + "<span>" + esc(t(escuro ? UI.claro : UI.escuro)) + "</span>";
  b.setAttribute("aria-label", t(UI.tema) + ": " + t(escuro ? UI.escuro : UI.claro));
  b.setAttribute("title", b.getAttribute("aria-label"));
}
function aplicaIdioma(cod, salvar){
  prefs.lang = cod;
  const meta = IDIOMAS.find(i => i.cod === cod) || IDIOMAS[0];
  document.documentElement.setAttribute("lang", meta.htmlLang);
  if (salvar) guarda("lang", cod);
  document.title = LIVRO.titulo + " — " + t(LIVRO.subtitulo).toLowerCase();
  montaNav();
  render();
}

   estado de navegação
   ========================================================= */
const estado = { itemId: "capa", tipo: "capa", vista: "tradicional", porcoes: 2 };
const receitaAtual = () => RECEITAS.find(r => r.id === estado.itemId);
function fator(){ const r = receitaAtual(); return r ? estado.porcoes / r.porcoes : 1; }
function numeroDaReceita(id){
  let n = 0;
  for (const cap of CAPITULOS)
    for (const x of RECEITAS.filter(y => y.capitulo === cap.id)) { n++; if (x.id === id) return n; }
  return 0;
}
const nn = id => String(numeroDaReceita(id)).padStart(2, "0");

/* =========================================================
   navegação
   ========================================================= */
function montaNav(){
  $("#brand-sub").textContent = t(LIVRO.subtitulo);
  $("#toggle-nav").textContent = t(UI.sumario);
  $("#h-tecnicas").textContent = t(UI.tecnicas);
  $("#h-receitas").textContent = t(UI.receitas);
  $("#foot-assina").innerHTML = t(UI.assinaturaSide);
  $("#link-sobre").textContent = t(UI.sobreLink);

  const si = $("#seg-idioma");
  si.innerHTML = "";
  IDIOMAS.forEach(i => {
    const b = el("button", null, i.curto);
    b.setAttribute("aria-pressed", prefs.lang === i.cod ? "true" : "false");
    b.setAttribute("title", i.nome);
    b.onclick = () => { if (prefs.lang !== i.cod) aplicaIdioma(i.cod, true); };
    si.appendChild(b);
  });
  pintaBotaoTema();

  const tec = $("#nav-tec"), rec = $("#nav-rec");
  tec.innerHTML = ""; rec.innerHTML = "";
  TECNICAS.forEach(x => {
    const b = el("button", null, esc(t(x.titulo)));
    b.onclick = () => abrir(x.id, "tecnica");
    b.dataset.id = x.id;
    tec.appendChild(b);
  });
  CAPITULOS.forEach(cap => {
    const doCap = RECEITAS.filter(x => x.capitulo === cap.id);
    if (!doCap.length) return;
    rec.appendChild(el("div", "cap", esc(t(cap.nome))));
    doCap.forEach(x => {
      const b = el("button", null, '<span class="num">' + nn(x.id) + "</span>" + esc(t(x.titulo)));
      b.onclick = () => abrir(x.id, "receita");
      b.dataset.id = x.id;
      rec.appendChild(b);
    });
  });
  marcaAtual();
}
function marcaAtual(){
  document.querySelectorAll(".nav button").forEach(b =>
    b.setAttribute("aria-current", b.dataset.id === estado.itemId ? "true" : "false"));
}
function fechaMenuMobile(){
  const s = $("#side");
  if (s.classList.contains("aberta")){
    s.classList.remove("aberta");
    $("#toggle-nav").setAttribute("aria-expanded", "false");
  }
}
function abrir(id, tipo){
  if (kAberto()) fechaCozinha();
  fechaMenuMobile();
  estado.itemId = id; estado.tipo = tipo;
  if (tipo === "receita"){
    const rec = RECEITAS.find(x => x.id === id);
    estado.porcoes = rec.porcoes;
    if (!["tradicional","tabela","interativo"].includes(estado.vista)) estado.vista = "tradicional";
  }
  marcaAtual();
  render();
  window.scrollTo({ top: 0, behavior: "instant" });
  if (id === "capa"){
    if (location.hash) history.replaceState(null, "", location.pathname + location.search);
  } else if (location.hash.replace("#", "") !== id) location.hash = id;
}

function render(){
  const m = $("#main");
  m.innerHTML = "";
  if (estado.tipo === "capa") renderCapa(m);
  else if (estado.tipo === "sobre") renderSobre(m);
  else if (estado.tipo === "tecnica") renderTecnica(m);
  else renderReceita(m);
  m.appendChild(colofao());
}

  l.querySelector("[data-sobre]").onclick = e => { e.preventDefault(); abrir("sobre", "sobre"); };
  c.appendChild(l);
  return c;
}

function renderCapa(m){

  const hero = el("div", "hero");

function renderGrade(m, r, interativo){
  const f = fator();
  const nCols = Math.max(...r.grade.map(g => g.col));
  const scroll = el("div", "grid-scroll");
  scroll.appendChild(el("div", "grid-band", esc(t(r.faixa))));

  const g = el("div", "grid");
  g.style.gridTemplateColumns = "minmax(260px, 1.45fr) repeat(" + nCols + ", minmax(120px, 1fr))";
  g.style.gridTemplateRows = "repeat(" + r.ingredientes.length + ", auto)";
  g.style.minWidth = (300 + nCols * 132) + "px";

  r.ingredientes.forEach((i, idx) => {
    const x = textoIng(i, f);
    const c = el("div", "g-ing",
      "<div>" + (x.q ? '<span class="q">' + esc(x.q) + "</span>" : "") + esc(x.nome) +
      (x.obs ? ' <span class="obs">— ' + esc(x.obs) + "</span>" : "") + "</div>");
    c.style.gridColumn = "1";
    c.style.gridRow = String(idx + 1);
    g.appendChild(c);
  });

  const ocupado = {};
  r.grade.forEach(s => {
    const c = el("div", "g-step",
      '<div class="t">' + esc(t(s.titulo)) + "</div>" +
      (s.detalhe ? '<div class="d">' + esc(t(s.detalhe)) + "</div>" : ""));
    c.style.gridColumn = String(s.col + 1);
    c.style.gridRow = (s.de + 1) + " / " + (s.ate + 2);
    for (let i = s.de; i <= s.ate; i++) ocupado[s.col + ":" + i] = true;
    g.appendChild(c);
  });
  for (let col = 1; col <= nCols; col++){
    for (let i = 0; i < r.ingredientes.length; i++){
      if (ocupado[col + ":" + i]) continue;
      const c = el("div", "g-empty");
      c.style.gridColumn = String(col + 1);
      c.style.gridRow = String(i + 1);
      g.appendChild(c);
    }
  }

  scroll.appendChild(g);
  m.appendChild(scroll);
  const hint = el("p", "hint", t(interativo ? UI.hintInterativo : UI.hintTabela));
  m.appendChild(hint);
  requestAnimationFrame(() => {
    if (scroll.scrollWidth > scroll.clientWidth + 4) hint.textContent = t(UI.hintScroll);
  });
}

/* =========================================================
   modo cozinha
   ========================================================= */
let kIdx = 0, kTimer = null, kRestante = 0, kTocando = false;
let audioCtx = null, wakeLock = null;
const kAberto = () => $("#kitchen").classList.contains("on");

function abreCozinha(i){
  if (estado.tipo !== "receita") return;
  kIdx = i; paraTimer(); kRestante = 0;
  $("#kitchen").classList.add("on");
  $("#kitchen").setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
  renderCozinha();
}
function fechaCozinha(){
  paraTimer(); kRestante = 0; soltaTela();
  $("#kitchen").classList.remove("on");
  $("#kitchen").setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
}
function paraTimer(){ if (kTimer){ clearInterval(kTimer); kTimer = null; } kTocando = false; soltaTela(); }

/* o navegador só permite criar/retomar áudio a partir de um gesto do usuário */
function preparaSom(){
  try{
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  }catch(e){ audioCtx = null; }
}
function bip(){
  try{
    if (audioCtx) [0, .38, .76].forEach(d => {
      const o = audioCtx.createOscillator(), gn = audioCtx.createGain();
      o.type = "sine"; o.frequency.value = 880;
      const ti = audioCtx.currentTime + d;
      gn.gain.setValueAtTime(.0001, ti);
      gn.gain.exponentialRampToValueAtTime(.35, ti + .02);
      gn.gain.exponentialRampToValueAtTime(.0001, ti + .3);
      o.connect(gn).connect(audioCtx.destination);
      o.start(ti); o.stop(ti + .32);
    });
  }catch(e){}
  if (navigator.vibrate) try{ navigator.vibrate([220, 120, 220, 120, 220]); }catch(e){}
}
async function seguraTela(){
  try{ if (!wakeLock && navigator.wakeLock) wakeLock = await navigator.wakeLock.request("screen"); }catch(e){}
}
function soltaTela(){ try{ if (wakeLock){ wakeLock.release(); wakeLock = null; } }catch(e){} }
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && kTimer && kAberto()) seguraTela();
});

function renderCozinha(){
  const r = receitaAtual(), f = fator(), k = $("#kitchen");
  const passo = r.modo[kIdx];
  k.innerHTML = "";

  const top = el("div", "k-top");
  top.appendChild(el("div", "k-name", esc(t(r.titulo)) + " · " + estado.porcoes + " " + esc(t(UI.porcoes))));
  const x = el("button", "k-x", esc(t(UI.sair)));
  x.onclick = fechaCozinha;
  top.appendChild(x);
  k.appendChild(top);

  const body = el("div", "k-body");
  const esq = el("div");
  esq.appendChild(el("div", "k-count", t(UI.passo) + " " + (kIdx + 1) + " " + t(UI.de) + " " + r.modo.length));
  esq.appendChild(el("p", "k-text", esc(t(passo.t))));

  if (passo.timer){
    const box = el("div", "k-timer");
    const clock = el("div", "k-clock", mmss(kRestante || passo.timer));
    if (kTocando) clock.classList.add("ring");
    const b = el("button", "k-tbtn", kTimer ? t(UI.pausar) : (kRestante ? t(UI.continuar) : t(UI.iniciar) + " " + mmss(passo.timer)));
    const z = el("button", "k-tbtn ghost", esc(t(UI.zerar)));
    z.style.visibility = (kRestante || kTocando) ? "visible" : "hidden";

    /* o relógio é atualizado no próprio nó — nada de re-renderizar aqui */
    b.onclick = () => {
      if (kTimer){ clearInterval(kTimer); kTimer = null; b.textContent = t(UI.continuar); return; }
      if (!kRestante) kRestante = passo.timer;
      kTocando = false;
      clock.classList.remove("ring");
      preparaSom(); seguraTela();
      b.textContent = t(UI.pausar);
      z.style.visibility = "visible";
      clock.textContent = mmss(kRestante);
      kTimer = setInterval(() => {
        kRestante--;
        clock.textContent = mmss(Math.max(0, kRestante));
        if (kRestante <= 0){
          clearInterval(kTimer); kTimer = null; kRestante = 0; kTocando = true;
          clock.classList.add("ring");
          b.textContent = t(UI.iniciar) + " " + mmss(passo.timer);
          bip();
        }
      }, 1000);
    };
    z.onclick = () => {
      paraTimer(); kRestante = 0;
      clock.classList.remove("ring");
      clock.textContent = mmss(passo.timer);
      b.textContent = t(UI.iniciar) + " " + mmss(passo.timer);
      z.style.visibility = "hidden";
    };
    box.appendChild(clock); box.appendChild(b); box.appendChild(z);
    esq.appendChild(box);
  }
  body.appendChild(esq);

  const dir = el("div", "k-ings");
  dir.appendChild(el("h4", null, esc(t(UI.ingredientes))));
  const ul = el("ul");
  r.ingredientes.forEach(i => {
    const x2 = textoIng(i, f);
    ul.appendChild(el("li", null, (x2.q ? '<span class="q">' + esc(x2.q) + "</span>" : "") + esc(x2.nome)));
  });
  dir.appendChild(ul);
  body.appendChild(dir);
  k.appendChild(body);

  const prog = el("div", "k-prog");
  r.modo.forEach((_, i) => { const b = el("i"); if (i <= kIdx) b.classList.add("done"); prog.appendChild(b); });
  k.appendChild(prog);

  const nav = el("div", "k-nav");
  const ant = el("button", null, esc(t(UI.anterior)));
  ant.disabled = kIdx === 0;
  ant.onclick = () => { paraTimer(); kRestante = 0; kIdx--; renderCozinha(); };
  const prox = el("button", "primary", esc(t(kIdx === r.modo.length - 1 ? UI.terminar : UI.proximo)));
  prox.onclick = () => {
    paraTimer(); kRestante = 0;
    if (kIdx === r.modo.length - 1) return fechaCozinha();
    kIdx++; renderCozinha();
  };
  nav.appendChild(ant); nav.appendChild(prox);
  k.appendChild(nav);
}

document.addEventListener("keydown", e => {
  if (!kAberto()) return;
  const r = receitaAtual();
  if (e.key === "Escape") fechaCozinha();
  if (e.key === "ArrowRight" && kIdx < r.modo.length - 1){ paraTimer(); kRestante = 0; kIdx++; renderCozinha(); }
  if (e.key === "ArrowLeft" && kIdx > 0){ paraTimer(); kRestante = 0; kIdx--; renderCozinha(); }
});

/* =========================================================
   arranque
   ========================================================= */
$("#ir-capa").onclick = () => abrir("capa", "capa");
$("#toggle-nav").onclick = () => {
  const s = $("#side"), aberta = s.classList.toggle("aberta");
  $("#toggle-nav").setAttribute("aria-expanded", aberta ? "true" : "false");
};
$("#link-sobre").onclick = e => { e.preventDefault(); abrir("sobre", "sobre"); };
$("#btn-tema").onclick = () => aplicaTema(prefs.tema === "escuro" ? "claro" : "escuro", true);

if (window.matchMedia){
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", ev => {
    if (!lembra("tema")) aplicaTema(ev.matches ? "escuro" : "claro", false);
  });
}

const sis = lembra("sistema");
if (sis === "caseiro" || sis === "peso") prefs.sistema = sis;
aplicaTema(detectaTema(), false);
prefs.lang = detectaIdioma();

function rota(){
  const h = location.hash.replace("#", "");
  if (h === estado.itemId) return;
  if (!h || h === "capa") return abrir("capa", "capa");
  if (h === "sobre") return abrir("sobre", "sobre");
  if (RECEITAS.some(r => r.id === h)) return abrir(h, "receita");
  if (TECNICAS.some(x => x.id === h)) return abrir(h, "tecnica");
  abrir("capa", "capa");
}
aplicaIdioma(prefs.lang, false);
rota();
window.addEventListener("hashchange", rota);
</script>
